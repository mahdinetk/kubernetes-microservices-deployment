
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: frontend-route
  namespace: microservices

spec:
  entryPoints:
    - websecure

  routes:
    - match: Host(`app.local`) && PathPrefix(`/`)
      kind: Rule
      priority: 10
      middlewares:
        - name: security-headers
      services:
        - name: frontend
          port: 80

  tls:
    secretName: app-local-tls

