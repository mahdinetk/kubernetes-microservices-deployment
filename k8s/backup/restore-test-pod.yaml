apiVersion: v1
kind: Pod
metadata:
  name: postgres-restore-test
  namespace: microservices
  labels:
    app: postgres-restore-test

spec:
  restartPolicy: Never

  initContainers:
    # Step 1: Clean the test data directory and set ownership.
    - name: prepare-data-directory
      image: postgres17-pgbackrest:local
      command:
        - sh
        - -c
        - |
          find /var/lib/postgresql/data -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          chown -R 999:999 /var/lib/postgresql/data
      securityContext:
        runAsUser: 0
      volumeMounts:
        - name: restore-data
          mountPath: /var/lib/postgresql/data

    # Step 2: Restore the backup into the test data directory.
    - name: restore-backup
      image: postgres17-pgbackrest:local
      command:
        - pgbackrest
        - --stanza=main
        - --pg1-path=/var/lib/postgresql/data
        - --log-level-console=info
        - restore
      securityContext:
        runAsUser: 999
        runAsGroup: 999
      volumeMounts:
        - name: restore-data
          mountPath: /var/lib/postgresql/data
        - name: backup-repository
          mountPath: /var/lib/pgbackrest
          readOnly: true
        - name: pgbackrest-config
          mountPath: /etc/pgbackrest/pgbackrest.conf
          subPath: pgbackrest.conf
          readOnly: true

  containers:
    # Step 3: Start PostgreSQL using the restored files.
    - name: postgres
      image: postgres17-pgbackrest:local
      args:
        - postgres
        - -c
        - archive_mode=off
        - -c
        - archive_command=/bin/true
      ports:
        - name: postgres
          containerPort: 5432
      volumeMounts:
        - name: restore-data
          mountPath: /var/lib/postgresql/data
        - name: backup-repository
          mountPath: /var/lib/pgbackrest
          readOnly: true
        - name: pgbackrest-config
          mountPath: /etc/pgbackrest/pgbackrest.conf
          subPath: pgbackrest.conf
          readOnly: true

  volumes:
    - name: restore-data
      persistentVolumeClaim:
        claimName: postgres-restore-test-pvc

    - name: backup-repository
      persistentVolumeClaim:
        claimName: pgbackrest-repo

    - name: pgbackrest-config
      configMap:
        name: pgbackrest-config
