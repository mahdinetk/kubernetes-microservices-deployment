apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: microservices

spec:
  serviceName: postgres
  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
        - name: postgres
          image: postgres:17

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_DB
              value: "microservices_db"

            - name: POSTGRES_USER
              value: "app"

            - name: POSTGRES_PASSWORD
              value: "123"

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
