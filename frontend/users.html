```

</div>

<script>

    // Collect basic device/browser information.
    const deviceInfo = {
        user_agent: navigator.userAgent,
        platform: navigator.platform,
        screen_width: window.screen.width,
        screen_height: window.screen.height
    };

    document.getElementById("browser").textContent = navigator.userAgent;
    document.getElementById("platform").textContent = navigator.platform;
    document.getElementById("screen").textContent =
        `${window.screen.width} x ${window.screen.height}`;


    // Save device information.
    document.getElementById("saveDevice").addEventListener("click", async function() {

        const message = document.getElementById("deviceMessage");

        try {

            const response = await fetch("/api/user/device", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(deviceInfo)
            });

            const data = await response.json();

            if (response.ok) {
                message.textContent = "Device information saved.";
            } else {
                message.textContent =
                    data.detail || "Could not save device information.";
            }

        } catch (error) {

            console.error(error);

            message.textContent =
                "Could not connect to the server.";
        }

    });


    // Load users.
    async function loadUsers() {

        const message = document.getElementById("usersMessage");
        const usersBody = document.getElementById("usersBody");

        try {

            const response = await fetch("/api/users");

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.detail || "Failed to load users.");
            }

            usersBody.innerHTML = "";

            data.forEach(user => {

                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${user.id}</td>
                    <td>${user.username}</td>
                    <td>${user.created_at || "-"}</td>
                `;

                usersBody.appendChild(row);
            });

            message.textContent = "";

        } catch (error) {

            console.error(error);

            message.textContent =
                "Could not load users.";
        }
    }


    // Logout.
    document.getElementById("logout").addEventListener("click", function() {

        localStorage.removeItem("user");

        window.location.href = "index.html";

    });


    loadUsers();

</script>

</body>
